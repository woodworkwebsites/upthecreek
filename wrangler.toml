name = "up-the-creek-padel"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[browser]
binding = "BROWSER"

[[d1_databases]]
binding = "DB"
database_name = "up-the-creek-orders"
database_id = "d08bff32-b0ff-404d-81f7-39d48686fc98"
migrations_dir = "db/migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "up-the-creek"

# Run: wrangler d1 create up-the-creek-orders
# Then replace the database_id above with the returned ID.
