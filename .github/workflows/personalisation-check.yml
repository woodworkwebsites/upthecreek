name: Personalisation build verification
on:
  pull_request:
    paths:
      - 'src/pages/ProductPage.tsx'
      - 'src/components/product/ImageGallery.tsx'
      - 'src/pages/admin/AdminProductsPage.tsx'
      - '.github/workflows/personalisation-check.yml'
      - 'scripts/test-personalisation.mjs'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
      - name: Install browser test runner
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test garment template and confirmation in Chromium
        run: |
          npx vite --host 127.0.0.1 > /tmp/utc-vite.log 2>&1 &
          sleep 6
          node scripts/test-personalisation.mjs
