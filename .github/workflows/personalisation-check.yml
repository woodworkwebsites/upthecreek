name: Personalisation build verification
on:
  pull_request:
    paths:
      - 'src/pages/ProductPage.tsx'
      - 'src/components/product/ImageGallery.tsx'
      - 'src/pages/admin/AdminProductsPage.tsx'
      - '.github/workflows/personalisation-check.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run build
